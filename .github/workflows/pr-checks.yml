name: PR Checks

on:
  push:
    branches: [master, dev, develop]
  pull_request:
    branches: [master, dev, develop]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-tools:
    name: Fork release tooling
    if: github.repository == 'LuigiVessella/yuzic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - name: Test release guards in an isolated repository
        shell: pwsh
        run: ./tools/fork/test-release-tools.ps1 -SkipAndroidPreflight

  checks:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Typed routes (.expo/types/router.d.ts) are gitignored; generate them
      # so the typecheck actually validates router.push/Link hrefs in CI.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      # Structural gates. Each one ratchets against
      # tools/architecture/allowlist.json: a new violation fails, and an
      # allowlisted entry that no longer violates also fails, so the list can
      # only ever shrink. See tools/architecture/allowlist.mjs.
      - name: Architecture gates
        run: npm run architecture:check

<div id="yuzic-concepts">
  <div class="viz-carousel viz-dotted-background" aria-label="Proposte Yuzic" data-previous-label="Precedente" data-next-label="Successiva">
    <section data-variant="Compatta" aria-label="Yuzic compatta"><div class="stage"><div class="phone" data-layout="compact" aria-label="Prototipo compatto Yuzic"></div></div></section>
    <section data-variant="Fotografica" aria-label="Yuzic fotografica" hidden><div class="stage"><div class="phone" data-layout="hero" aria-label="Prototipo fotografico Yuzic"></div></div></section>
  </div>
<style>
#yuzic-concepts {font-family:Inter,system-ui,sans-serif;color-scheme:light dark}
#yuzic-concepts *{box-sizing:border-box}
#yuzic-concepts .stage{min-height:1000px;display:flex;justify-content:center;padding:22px 8px 30px}
#yuzic-concepts .phone{--bg:light-dark(#f8f9fb,#101113);--panel:light-dark(#edf0f4,#1b1d22);--ink:light-dark(#141920,#f5f6f8);--dim:light-dark(#5c6471,#a8aeb9);--line:light-dark(#dce1e8,#30333b);--accent:#258bb9;--rad:14px;width:390px;max-width:100%;align-self:start;background:var(--bg);color:var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 14px 48px #0002;border:1px solid var(--line);font-size:14px;line-height:1.4}
#yuzic-concepts button{font:inherit;color:inherit;cursor:pointer}
#yuzic-concepts button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#yuzic-concepts .status{padding:14px 22px 6px;display:flex;justify-content:space-between;font-size:12px;font-weight:600}
#yuzic-concepts .top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
#yuzic-concepts .icon{background:transparent;border:0;width:44px;height:44px;display:inline-flex;justify-content:center;align-items:center;border-radius:var(--rad);flex-shrink:0}
#yuzic-concepts svg{width:20px;height:20px}
#yuzic-concepts .page{padding:0 18px 22px;min-height:650px}
#yuzic-concepts h1{font-size:30px;line-height:1.1;letter-spacing:-1px;margin:0;font-weight:650}
#yuzic-concepts h2{font-size:19px;line-height:1.25;letter-spacing:-.4px;margin:0;font-weight:600}
#yuzic-concepts h3{font-size:15px;margin:0;font-weight:600}
#yuzic-concepts p{margin:0}
#yuzic-concepts .muted{color:var(--dim);font-size:12px}
#yuzic-concepts .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);font-weight:600}
#yuzic-concepts .identity{display:flex;gap:16px;align-items:center;padding:14px 0 20px}
#yuzic-concepts .portrait{height:84px;width:84px;border-radius:50%;background:linear-gradient(150deg,#4a6571,#26353f 62%,#172128);color:#e8eef3;display:grid;place-items:center;font-size:32px;flex-shrink:0}
#yuzic-concepts .identity h1{margin:5px 0 6px}
#yuzic-concepts .credit{padding-top:8px;font-size:11px;color:var(--dim)}
#yuzic-concepts .actions{display:flex;gap:10px;margin-bottom:24px}
#yuzic-concepts .primary{border:0;border-radius:var(--rad);background:var(--accent);color:#fff;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;font-weight:600;flex:1}
#yuzic-concepts .secondary{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);padding:10px 16px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px}
#yuzic-concepts .section{margin-top:24px}
#yuzic-concepts .heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
#yuzic-concepts .link{background:none;border:0;color:var(--accent);min-height:44px;padding:5px 0;font-size:12px;font-weight:600}
#yuzic-concepts .row{width:100%;display:flex;gap:12px;align-items:center;padding:9px 0;text-align:left;background:none;border:0;min-height:66px}
#yuzic-concepts .row .copy{flex:1;min-width:0}
#yuzic-concepts .row .copy p:first-child{font-weight:550}
#yuzic-concepts .art{width:52px;height:52px;border-radius:calc(var(--rad) * .55);display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,#274b58,#132d36);color:#fff;font-weight:650;font-size:13px;text-align:center;padding:5px;line-height:1.1;letter-spacing:.5px}
#yuzic-concepts .art.sand{background:linear-gradient(135deg,#ac9674,#645643);color:#fff7ea}
#yuzic-concepts .art.paper{background:linear-gradient(135deg,#e9e6df,#a6b0ae);color:#252d2b}
#yuzic-concepts .art.ink{background:linear-gradient(135deg,#353b48,#171a21)}
#yuzic-concepts .more{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);text-align:left;margin-top:10px;min-height:64px}
#yuzic-concepts .more svg{color:var(--dim)}
#yuzic-concepts .related{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#yuzic-concepts .related button{padding:0;background:none;border:0;text-align:center;min-width:0}
#yuzic-concepts .related .portrait{width:70px;height:70px;margin:0 auto 7px;font-size:23px}
#yuzic-concepts .related p{font-size:12px}
#yuzic-concepts .related .muted{font-size:11px;margin-top:3px}
#yuzic-concepts .player{margin:0 10px 8px;padding:8px 10px;background:var(--panel);border-radius:var(--rad);display:flex;align-items:center;gap:10px}
#yuzic-concepts .player .art{width:38px;height:38px;font-size:10px}
#yuzic-concepts .player .copy{flex:1;font-size:12px}
#yuzic-concepts .nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:4px 4px 12px}
#yuzic-concepts .nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;width:30%;background:none;border:0;color:var(--dim);font-size:10px}
#yuzic-concepts .nav button.active{color:var(--accent)}
#yuzic-concepts .banner{padding:18px 0 8px}
#yuzic-concepts .banner h1{margin-top:6px}
#yuzic-concepts .shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#yuzic-concepts .tile{background:none;border:0;text-align:left;padding:0;min-width:0}
#yuzic-concepts .tile .art{width:100%;height:auto;aspect-ratio:1;margin-bottom:8px;font-size:21px}
#yuzic-concepts .tile p{font-size:13px}
#yuzic-concepts .source{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:11px;margin:5px 0 8px}
#yuzic-concepts .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
#yuzic-concepts .filterbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
#yuzic-concepts .filterbar label{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--dim)}
#yuzic-concepts input{accent-color:var(--accent)}
#yuzic-concepts .search{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--rad);padding:12px;font:inherit;margin:16px 0 0}
#yuzic-concepts .artistgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding-top:12px}
#yuzic-concepts .artistgrid button{border:0;background:none;padding:0;text-align:center}
#yuzic-concepts .artistgrid .portrait{height:108px;width:108px;margin:0 auto 9px;font-size:30px}
#yuzic-concepts .artistgrid p{font-size:14px}
#yuzic-concepts .artistgrid .muted{font-size:12px;margin-top:4px}
#yuzic-concepts .hero{margin:0 -18px 18px;padding:68px 20px 22px;background:linear-gradient(140deg,#435d69,#18232c 70%);color:#fff;position:relative}
#yuzic-concepts .hero::before{content:'G';position:absolute;right:26px;top:5px;font-size:160px;font-weight:650;color:#b1c8d420;line-height:1}
#yuzic-concepts .hero h1{font-size:38px;margin:8px 0;position:relative}
#yuzic-concepts .hero .muted,#yuzic-concepts .hero .eyebrow{color:#c6d1d9}
#yuzic-concepts .hero .credit{color:#c6d1d9}
#yuzic-concepts .modal{padding:20px 0 10px;border-top:1px solid var(--line);margin-top:16px}
#yuzic-concepts .modal button{width:100%;margin:8px 0}
#yuzic-concepts .notice{min-height:20px;font-size:12px;color:var(--dim);padding:0 18px 8px}
#yuzic-concepts [hidden]{display:none!important}
@media(max-width:400px){#yuzic-concepts .stage{padding:8px 0 24px;min-height:1030px}#yuzic-concepts .page{padding-left:14px;padding-right:14px}#yuzic-concepts .hero{margin-left:-14px;margin-right:-14px}#yuzic-concepts .related .portrait{width:60px;height:60px}#yuzic-concepts .artistgrid .portrait{width:90px;height:90px}}
</style>
<script>
(()=>{
const root=document.getElementById('yuzic-concepts');
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const releases=[['Tropico del capricorno','2025','TDC','sand'],['Madreperla','2023','MADRE\u200bPERLA','ink'],['Sinatra','2018','SINATRA','paper']];
const outside=[['Il ragazzo d’oro','2011','ORO','sand'],['Gentleman','2017','GENTLEMAN','ink'],['Mr. Fini','2020','MR. FINI','paper']];
const profiles=[['Fabri Fibra','F','1 album · 17 brani'],['Guè','G','6 album · 22 brani'],['Marracash','M','7 album · 51 brani'],['Salmo','S','4 album'],['Geolier','G','1 album'],['Sfera Ebbasta','SE','1 album']];
function art(label,tone=''){return `<span class="art ${tone}" aria-hidden="true">${label}</span>`}
function row(item,action='album'){return `<button class="row" data-action="${action}" data-name="${item[0]}">${art(item[2],item[3])}<span class="copy"><p>${item[0]}</p><p class="muted">${item[1]}</p></span>${icon('chevron-right')}</button>`}
function tile(item){return `<button class="tile" data-action="album" data-name="${item[0]}">${art(item[2],item[3])}<p>${item[0]}</p><p class="muted">${item[1]}</p></button>`}
root.querySelectorAll('.phone').forEach(phone=>{
 const state={screen:'artist',name:'Guè',menu:false,playing:false,collaborations:false,radius:14,accent:'#258bb9'};
 const header=()=>`<div class="status"><span>9:41</span><span>5G ▰</span></div><div class="top"><button class="icon" data-action="back" aria-label="Indietro">${icon('chevron-left')}</button><span class="eyebrow">${state.screen==='artist'?'Artista':state.screen==='releases'?'Discografia':'Yuzic'}</span><button class="icon" data-action="menu" aria-label="Altre opzioni">${icon('ellipsis')}</button></div>`;
 function artist(){const local=state.name!=='Emis Killa';const counts=state.name==='Fabri Fibra'?'1 album · 17 brani':state.name==='Guè'?'6 album · 22 brani':'7 album · 51 brani';const records=state.name==='Fabri Fibra'?[['Caos','2022','CAOS','paper']]:releases;return `${phone.dataset.layout==='hero'?`<div class="hero"><p class="eyebrow">${local?'Nella tua libreria':'Catalogo Deezer'}</p><h1>${state.name}</h1><p class="muted">${local?counts:'Artista esterno'}</p><p class="credit">Ritratto illustrativo</p></div>`:`<div class="identity"><span class="portrait" aria-hidden="true">${state.name[0]}</span><div><p class="eyebrow">${local?'Nella tua libreria':'Catalogo Deezer'}</p><h1>${state.name}</h1><p class="muted">${local?counts:'Artista esterno'}</p></div></div>`}
 ${local?`<div class="actions"><button class="primary" data-action="play">${icon(state.playing?'pause':'play')} ${state.playing?'Pausa':'Riproduci'}</button><button class="secondary" data-action="shuffle" aria-label="Riproduzione casuale">${icon('shuffle')}</button></div>`:''}
 <div class="heading"><h2>${local?'Album in libreria':'Album'}</h2><button class="link" data-action="owned">Vedi tutti</button></div>${records.slice(0,2).map(r=>row(r)).join('')}
 <button class="more" data-action="external"><span><strong>Esplora le uscite mancanti</strong><p class="muted">Cataloghi esterni · anteprime e richieste</p></span>${icon('arrow-up-right')}</button>
 <section class="section"><div class="heading"><h2>Artisti simili</h2></div><div class="related">${[['Fabri Fibra','F','In libreria'],['Marracash','M','In libreria'],['Emis Killa','EK','Deezer']].filter(a=>a[0]!==state.name).map(a=>`<button data-action="artist" data-name="${a[0]}"><span class="portrait" aria-hidden="true">${a[1]}</span><p>${a[0]}</p><p class="muted">${a[2]}</p></button>`).join('')}</div></section>
 <section class="section"><div class="heading"><h2>Brani popolari</h2><span class="muted">Deezer</span></div>${row(['Brivido','Anteprima · 30 secondi','♪','ink'],'preview')}</section>
 <section class="section"><div class="heading"><h2>Biografia</h2><button class="link" data-action="bio">Leggi</button></div><p class="muted">Informazioni sull’artista · Last.fm</p></section>`}
 function home(){return `<div class="banner"><p class="eyebrow">La tua musica</p><h1>Riparti da qui</h1></div>${row(['Hugh Guefner','Guè · Sinatra','S','paper'],'play')}${row(['Prefissi','Guè · Tropico del capricorno','TDC','sand'],'play')}<section class="section"><div class="heading"><h2>Aggiunti di recente</h2><button class="link" data-action="owned">Vedi tutti</button></div><div class="shelf">${releases.slice(0,2).map(tile).join('')}</div></section><section class="section"><div class="heading"><h2>Da riscoprire</h2><span class="muted">Dalla libreria</span></div>${row(['Caos','Fabri Fibra · 2022','CAOS','paper'],'fibra')}</section><section class="section"><div class="source"><span class="dot"></span> Scoperta · Deezer</div><h2>Se ti piace Guè</h2><p class="muted">Suggerimenti dal catalogo esterno</p><div class="related" style="margin-top:16px"><button data-action="artist" data-name="Emis Killa"><span class="portrait">EK</span><p>Emis Killa</p><p class="muted">Deezer</p></button><button data-action="artist" data-name="Fabri Fibra"><span class="portrait">F</span><p>Fabri Fibra</p><p class="muted">In libreria</p></button></div></section>`}
 function library(){return `<div class="banner"><p class="eyebrow">Libreria / Artisti</p><h1>Artisti</h1><p class="muted">26 artisti principali</p></div><input class="search" type="search" aria-label="Cerca nei tuoi artisti" placeholder="Cerca nei tuoi artisti"><div class="filterbar"><span class="muted">Alfabetico</span><label><input type="checkbox" data-collab ${state.collaborations?'checked':''}>Collaborazioni</label></div><div class="artistgrid">${[...profiles,...(state.collaborations?[['Guè feat. Capo Plaza','G+C','Credito della libreria']]:[])].map(a=>`<button data-action="artist" data-name="${a[0]}"><span class="portrait" aria-hidden="true">${a[1]}</span><p>${a[0]}</p><p class="muted">${a[2]}</p></button>`).join('')}</div>`}
 function catalogue(){return `<div class="banner"><p class="eyebrow">${state.external?'Fuori libreria · Deezer':'Nella tua libreria'}</p><h1>${state.name}</h1><p class="muted">${state.external?'Uscite mancanti':'Album posseduti'}</p></div><div class="filterbar"><span class="muted">Dal più recente</span>${icon('arrow-down-wide-narrow')}</div>${(state.external?outside:releases).map(r=>row(r)).join('')}<p class="muted" style="margin-top:16px">${state.external?'Le uscite esterne aprono la pagina del catalogo.':'Riproduzione dalla tua libreria.'}</p>`}
 function render(){phone.style.setProperty('--rad',state.radius+'px');phone.style.setProperty('--accent',state.accent);phone.innerHTML=header()+`<main class="page">${state.screen==='artist'?artist():state.screen==='home'?home():state.screen==='library'?library():catalogue()}${state.menu?`<div class="modal"><h2>Opzioni artista</h2><button class="secondary" data-action="save">Aggiungi ai preferiti</button><button class="secondary" data-action="bio">Informazioni sull’artista</button><button class="secondary" data-action="menu">Chiudi</button></div>`:''}</main><div class="notice" role="status" aria-live="polite"></div><div class="player">${art('RINO','sand')}<div class="copy"><p>Ma il cielo è sempre più blu</p><p class="muted">Rino Gaetano</p></div><button class="icon" data-action="play" aria-label="${state.playing?'Pausa':'Riproduci'}">${icon(state.playing?'pause':'play')}</button></div><nav class="nav" aria-label="Navigazione principale">${[['home','house','Home'],['library','library','Libreria']].map(a=>`<button data-action="${a[0]}" class="${state.screen===a[0]?'active':''}">${icon(a[1])}${a[2]}</button>`).join('')}<button data-action="search">${icon('search')}Cerca</button></nav>`;if(globalThis.lucide)lucide.createIcons();}
 phone.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;let message='';if(a==='artist'||a==='fibra'){state.screen='artist';state.name=a==='fibra'?'Fabri Fibra':b.dataset.name;}else if(a==='home'||a==='library')state.screen=a;else if(a==='external'||a==='owned'){state.screen='releases';state.external=a==='external';}else if(a==='back')state.screen=state.screen==='releases'?'artist':'library';else if(a==='menu')state.menu=!state.menu;else if(a==='play'||a==='shuffle'){state.playing=!state.playing;message='Simulazione del controllo di riproduzione';}else if(a==='preview')message='Simulazione: anteprima di 30 secondi';else if(a==='album')message='Aprirebbe la pagina di '+b.dataset.name;else if(a==='search'){state.screen='library';message='Prova la ricerca nella raccolta Artisti';}else if(a==='bio')message='Aprirebbe la biografia completa con la fonte';else if(a==='save')message='Simulazione: aggiunto ai preferiti';render();phone.querySelector('.notice').textContent=message;});
 phone.addEventListener('change',e=>{if(e.target.matches('[data-collab]')){state.collaborations=e.target.checked;render();}});
 phone.addEventListener('input',e=>{if(e.target.matches('.search'))phone.querySelectorAll('.artistgrid button').forEach(b=>{b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase());});});
 render();if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:render});tweak.addSlider(state,'radius',{label:'Angoli',min:0,max:24,unit:'px'});tweak.addColorPicker(state,'accent',{label:'Accento'});}
});
})();
</script>
</div>

<div id="yuzic-studio">
<div class="viz-carousel viz-dotted-background" aria-label="Yuzic · nuove proposte" data-previous-label="Precedente" data-next-label="Successiva">
<section data-variant="Home" aria-label="Home"><div class="stage"><div class="app" data-start="home" aria-label="Yuzic Home"></div></div></section>
<section data-variant="Artista" aria-label="Pagina artista" hidden><div class="stage"><div class="app" data-start="artist" aria-label="Yuzic Artista"></div></div></section>
<section data-variant="Artisti" aria-label="Raccolta artisti" hidden><div class="stage"><div class="app" data-start="artists" aria-label="Yuzic Artisti"></div></div></section>
<section data-variant="Album esterno" aria-label="Album esterno" hidden><div class="stage"><div class="app" data-start="album" aria-label="Yuzic Album esterno"></div></div></section>
<section data-variant="Ricerca" aria-label="Ricerca" hidden><div class="stage"><div class="app" data-start="search" aria-label="Yuzic Ricerca"></div></div></section>
<section data-variant="Playlist" aria-label="Playlist" hidden><div class="stage"><div class="app" data-start="playlist" aria-label="Yuzic Playlist"></div></div></section>
<section data-variant="Player" aria-label="Player" hidden><div class="stage"><div class="app" data-start="player" aria-label="Yuzic Player"></div></div></section>
<section data-variant="Coda" aria-label="Coda" hidden><div class="stage"><div class="app" data-start="queue" aria-label="Yuzic Coda"></div></div></section>
<section data-variant="Download" aria-label="Download" hidden><div class="stage"><div class="app" data-start="downloads" aria-label="Yuzic Download"></div></div></section>
<section data-variant="Richieste" aria-label="Richieste" hidden><div class="stage"><div class="app" data-start="wants" aria-label="Yuzic Richieste"></div></div></section>
<section data-variant="Impostazioni" aria-label="Impostazioni" hidden><div class="stage"><div class="app" data-start="settings" aria-label="Yuzic Impostazioni"></div></div></section>
</div>
<style>
#yuzic-studio{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light dark}
#yuzic-studio *{box-sizing:border-box}
#yuzic-studio .stage{display:flex;justify-content:center;min-height:1360px;padding:20px 8px 32px}
#yuzic-studio .app{--bg:light-dark(#faf9f6,#111316);--surface:light-dark(#eeefed,#202329);--text:light-dark(#192027,#f4f5f6);--muted:light-dark(#5e666e,#a8afb8);--line:light-dark(#dedfdf,#2d3238);--blue:light-dark(#116b98,#80c9ed);--fill:light-dark(#067ba9,#86d2ef);--onfill:light-dark(#fff,#10232d);--r:12px;background:var(--bg);color:var(--text);width:390px;max-width:100%;align-self:start;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 18px 55px #0002;position:relative;font-size:14px;line-height:1.4}
#yuzic-studio button,#yuzic-studio input{font:inherit;color:inherit}
#yuzic-studio button{border:0;background:none;cursor:pointer}
#yuzic-studio button:focus-visible,#yuzic-studio input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#yuzic-studio svg{width:20px;height:20px;stroke-width:1.7;flex-shrink:0}
#yuzic-studio img{display:block;object-fit:cover;background:var(--surface)}
#yuzic-studio p,#yuzic-studio h1,#yuzic-studio h2,#yuzic-studio h3{margin:0}
#yuzic-studio h1{font-size:30px;line-height:1.12;letter-spacing:-1px;font-weight:650}
#yuzic-studio h2{font-size:20px;line-height:1.25;letter-spacing:-.6px;font-weight:600}
#yuzic-studio h3{font-size:16px;font-weight:600;letter-spacing:-.25px}
#yuzic-studio .status{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 8px;font-size:12px;font-weight:600}
#yuzic-studio .status svg{width:15px;height:15px}
#yuzic-studio .status span:last-child{display:flex;gap:5px;align-items:center}
#yuzic-studio .bar{display:flex;justify-content:space-between;align-items:center;padding:0 10px;min-height:48px}
#yuzic-studio .brand{display:flex;align-items:center;gap:8px;font-size:20px;letter-spacing:-.6px;font-weight:650;padding-left:8px}
#yuzic-studio .brand svg{color:var(--blue);width:25px;height:25px}
#yuzic-studio .brand img{width:26px;height:26px;object-fit:contain;background:none}
#yuzic-studio .icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--r);padding:0;flex-shrink:0}
#yuzic-studio .subtle{color:var(--muted)}
#yuzic-studio .body{padding:0 18px 24px;min-height:780px}
#yuzic-studio .small{font-size:12px;color:var(--muted);line-height:1.5}
#yuzic-studio .eyebrow{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
#yuzic-studio .heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
#yuzic-studio .textbtn{min-height:44px;font-size:12px;font-weight:600;color:var(--blue);padding:6px 0}
#yuzic-studio .section{margin-top:26px}
#yuzic-studio .source{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);line-height:1.4}
#yuzic-studio .source svg{width:13px;height:13px}
#yuzic-studio .intro{padding:16px 0 20px}
#yuzic-studio .intro h1{margin-top:5px}
#yuzic-studio .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#yuzic-studio .quick button{display:flex;align-items:center;gap:9px;text-align:left;background:var(--surface);border-radius:calc(var(--r) * .65);overflow:hidden;padding:0 8px 0 0;min-height:56px}
#yuzic-studio .quick img{width:56px;height:56px;flex-shrink:0}
#yuzic-studio .quick span{font-size:12px;font-weight:600;line-height:1.25;min-width:0}
#yuzic-studio .spotlight{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px;margin-top:24px}
#yuzic-studio .spotlight>img{width:112px;height:112px;border-radius:calc(var(--r)*.6)}
#yuzic-studio .spotlight .eyebrow{font-size:10px;letter-spacing:1px}
#yuzic-studio .spotlight h3{margin:6px 0 3px}
#yuzic-studio .spotlight .textbtn{display:flex;align-items:center;gap:5px;min-height:36px}
#yuzic-studio .shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#yuzic-studio .tile{padding:0;text-align:left;min-width:0;display:block}
#yuzic-studio .tile img{width:100%;aspect-ratio:1;border-radius:calc(var(--r)*.6);margin-bottom:9px}
#yuzic-studio .tile h3{font-size:14px;line-height:1.3;margin-bottom:3px}
#yuzic-studio .discovery{border-top:1px solid var(--line);padding-top:20px}
#yuzic-studio .discovery h2{margin:8px 0 15px}
#yuzic-studio .hero{margin:0 -18px;position:relative;height:252px;isolation:isolate;background:#262e35;color:#fff}
#yuzic-studio .hero>img{position:absolute;inset:0;width:100%;height:100%;object-position:50% 27%;z-index:-2}
#yuzic-studio .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#090e15f5,transparent 83%);z-index:-1}
#yuzic-studio .hero-copy{position:absolute;left:20px;bottom:20px;right:20px}
#yuzic-studio .hero h1{font-size:42px;letter-spacing:-1.7px;margin:5px 0 7px}
#yuzic-studio .hero .source{color:#e2e9ef}
#yuzic-studio .hero .eyebrow{color:#d0dce5}
#yuzic-studio .local-meta{display:flex;align-items:center;justify-content:space-between;padding-top:16px;gap:8px}
#yuzic-studio .local-meta .source{color:var(--blue)}
#yuzic-studio .actions{display:flex;justify-content:center;align-items:center;gap:16px;margin:18px 0 22px}
#yuzic-studio .round{background:var(--surface);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
#yuzic-studio .play{height:52px;min-width:112px;border-radius:26px;background:var(--fill);color:var(--onfill);display:flex;justify-content:center;align-items:center;gap:9px;font-weight:600;padding:0 20px}
#yuzic-studio .play svg{fill:currentColor;width:24px;height:24px}
#yuzic-studio .row{display:flex;align-items:center;gap:12px;min-height:68px}
#yuzic-studio .row-main{display:flex;align-items:center;gap:12px;text-align:left;flex:1;min-width:0;padding:7px 0}
#yuzic-studio .row img{width:48px;height:48px;border-radius:calc(var(--r)*.4)}
#yuzic-studio .row .copy{min-width:0;flex:1}
#yuzic-studio .row h3{font-size:14px;line-height:1.3;margin-bottom:3px}
#yuzic-studio .row .index{width:14px;flex-shrink:0;color:var(--muted);font-size:12px;text-align:center}
#yuzic-studio .escape{width:100%;display:flex;align-items:center;gap:12px;padding:14px 0;margin-top:8px;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#yuzic-studio .escape>svg:first-child{color:var(--blue)}
#yuzic-studio .escape span{flex:1;font-size:14px;font-weight:550}
#yuzic-studio .escape small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
#yuzic-studio .people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#yuzic-studio .person{padding:0;min-width:0;text-align:center}
#yuzic-studio .person img{aspect-ratio:1;width:100%;border-radius:50%;margin-bottom:8px}
#yuzic-studio .person h3{font-size:12px;line-height:1.35}
#yuzic-studio .person .small{font-size:11px}
#yuzic-studio .artist-intro{padding:20px 0 10px}
#yuzic-studio .artist-intro .small{margin-top:7px}
#yuzic-studio .search{display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--surface);border-radius:var(--r);margin:12px 0}
#yuzic-studio .search svg{color:var(--muted);width:18px}
#yuzic-studio input[type=search]{border:0;background:none;width:100%;min-width:0;min-height:44px;padding:0;font-size:14px}
#yuzic-studio .filter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 20px}
#yuzic-studio .filter label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:44px}
#yuzic-studio input[type=checkbox]{accent-color:var(--blue)}
#yuzic-studio .artist-list{display:grid;grid-template-columns:1fr 1fr;gap:24px 22px}
#yuzic-studio .artist-list .person img{width:120px;max-width:100%;margin:0 auto 10px}
#yuzic-studio .artist-list .person h3{font-size:16px}
#yuzic-studio .artist-list .person .small{font-size:12px;margin-top:3px}
#yuzic-studio .collection-row{display:flex;width:100%;gap:16px;align-items:center;text-align:left;padding:18px 0;border-bottom:1px solid var(--line)}
#yuzic-studio .collection-row>svg:first-child{width:24px;height:24px;color:var(--blue)}
#yuzic-studio .collection-row>img{width:48px;height:48px;border-radius:calc(var(--r)*.5)}
#yuzic-studio .collection-row span{flex:1}
#yuzic-studio .album-art{width:224px;max-width:78%;aspect-ratio:1;margin:20px auto 24px;border-radius:calc(var(--r)*.6);box-shadow:0 12px 32px #0003}
#yuzic-studio .album-name{font-size:28px;margin-bottom:9px}
#yuzic-studio .artist-link{display:flex;gap:8px;align-items:center;padding:0;margin:9px 0 8px;font-size:14px;font-weight:550}
#yuzic-studio .artist-link img{width:24px;height:24px;border-radius:50%}
#yuzic-studio .external-info{margin-top:16px;border-left:2px solid var(--blue);padding-left:12px}
#yuzic-studio .external-info strong{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
#yuzic-studio .request{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--fill);color:var(--onfill);border-radius:var(--r);min-height:48px;padding:10px 14px;margin-top:18px;font-weight:600}
#yuzic-studio .mini{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);margin:0 8px 5px;padding:6px 7px 6px 6px;position:relative;overflow:hidden}
#yuzic-studio .mini img{width:42px;height:42px;border-radius:calc(var(--r)*.4)}
#yuzic-studio .mini .copy{flex:1;min-width:0;font-size:12px;font-weight:550}
#yuzic-studio .mini .small{font-size:11px;font-weight:400}
#yuzic-studio .mini::after{position:absolute;content:'';height:2px;bottom:0;left:0;width:38%;background:var(--blue)}
#yuzic-studio .nav{display:flex;justify-content:space-around;padding:4px 6px 12px;background:var(--bg)}
#yuzic-studio .nav button{display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:center;min-height:54px;width:30%;font-size:10px;color:var(--muted);padding:4px}
#yuzic-studio .nav .selected{color:var(--blue)}
#yuzic-studio .nav .selected svg{stroke-width:2.2}
#yuzic-studio .notice{font-size:12px;color:var(--blue);padding:10px 18px;min-height:0}
#yuzic-studio .notice:empty{display:none}
#yuzic-studio .scrim{position:absolute;inset:0;background:#0008;z-index:5;display:flex;align-items:flex-end}
#yuzic-studio .sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:12px 20px 24px;box-shadow:0 -8px 35px #0002}
#yuzic-studio .handle{width:32px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 18px}
#yuzic-studio .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
#yuzic-studio .sheet .sheet-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:50px;border-bottom:1px solid var(--line);padding:10px 0}
#yuzic-studio .sheet .sheet-row span{flex:1}
#yuzic-studio .sheet .request{margin-top:20px}
#yuzic-studio .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
#yuzic-studio .chip{min-height:36px;padding:8px 14px;border-radius:20px;background:var(--surface);font-size:12px}
#yuzic-studio .chip[aria-pressed=true]{background:var(--fill);color:var(--onfill)}
#yuzic-studio .mosaic{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;width:218px;max-width:80%;margin:20px auto 24px;border-radius:var(--r);overflow:hidden}
#yuzic-studio .mosaic img{width:100%;height:100%;aspect-ratio:1}
#yuzic-studio .player-cover{width:100%;aspect-ratio:1;border-radius:var(--r);margin:36px 0 32px;box-shadow:0 12px 35px #0003}
#yuzic-studio .song-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
#yuzic-studio .song-head h1{font-size:28px}
#yuzic-studio .song-head .small{font-size:16px;margin-top:6px}
#yuzic-studio .timeline{margin-top:24px}
#yuzic-studio .timeline input{width:100%;accent-color:var(--blue);margin:0;min-height:32px}
#yuzic-studio .times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
#yuzic-studio .transport{display:flex;align-items:center;justify-content:space-between;margin:22px 0 28px}
#yuzic-studio .transport .play{width:68px;height:68px;min-width:0;border-radius:50%;padding:0}
#yuzic-studio .transport .icon svg{width:26px;height:26px}
#yuzic-studio .player-links{display:flex;justify-content:space-between;gap:8px;margin-top:22px}
#yuzic-studio .player-links button{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;min-height:44px;padding:6px}
#yuzic-studio .playing-row{border-left:2px solid var(--blue);padding-left:10px;background:var(--surface);border-radius:0 var(--r) var(--r) 0}
#yuzic-studio .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--blue);margin-top:6px}
#yuzic-studio .badge svg{width:13px;height:13px}
#yuzic-studio .meter{height:3px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden}
#yuzic-studio .meter span{display:block;height:100%;background:var(--blue)}
#yuzic-studio .download-row{padding:12px 0;border-bottom:1px solid var(--line)}
#yuzic-studio .download-row .row{min-height:56px}
#yuzic-studio .setting{display:flex;align-items:center;gap:12px;padding:15px 0;min-height:64px;border-bottom:1px solid var(--line)}
#yuzic-studio .setting>svg{color:var(--blue)}
#yuzic-studio .setting span{flex:1}
#yuzic-studio .setting input[type=checkbox]{width:20px;height:20px;flex-shrink:0}
#yuzic-studio .setting button{flex-shrink:0}
#yuzic-studio .demo-note{font-size:11px;text-align:center;color:var(--muted);padding:16px 4px 0}
#yuzic-studio .mini-open{display:flex;align-items:center;gap:10px;text-align:left;flex:1;min-width:0;padding:0}
#yuzic-studio .lyric-lines{padding:30px 0;display:flex;flex-direction:column;gap:18px}
#yuzic-studio .lyric-lines span{height:12px;width:80%;border-radius:4px;background:var(--line)}
#yuzic-studio .lyric-lines span:nth-child(2){width:60%;background:var(--blue)}
#yuzic-studio .active-control{color:var(--blue)}
#yuzic-studio [aria-label="Rimuovi dai preferiti"] svg{fill:var(--blue);stroke:var(--blue)}
#yuzic-studio .app[data-appearance=dark]{color-scheme:dark}
#yuzic-studio .app[data-appearance=light]{color-scheme:light}
#yuzic-studio [hidden]{display:none!important}
@media(max-width:400px){#yuzic-studio .stage{padding:8px 0 24px}#yuzic-studio .body{padding-left:16px;padding-right:16px}#yuzic-studio .hero{margin-left:-16px;margin-right:-16px}#yuzic-studio .quick img{width:46px;height:52px}#yuzic-studio .spotlight>img{width:96px;height:96px}#yuzic-studio .spotlight{gap:12px}#yuzic-studio .artist-list{gap:22px 18px}}
</style>
<script>
(()=>{
const root=document.getElementById('yuzic-studio');

function home(){return `<div class="intro"><p class="eyebrow">La tua libreria, in ascolto</p><h1>La tua musica.</h1></div><div class="quick">${['sinatra','caos','persona','madreperla'].map(k=>`<button data-action="album" data-key="${k}">${pic(k)}<span>${records[k].title}</span></button>`).join('')}</div><div class="spotlight">${pic('tropico','','Tropico del capricorno')}<div><p class="eyebrow">Riprodotto di recente</p><h3>Tropico del capricorno</h3><p class="small">Guè · dalla tua libreria</p><button class="textbtn" data-action="play">${ic(state.playing?'pause':'play')} ${state.playing?'In pausa':'Riascolta'}</button></div></div><section class="section"><div class="heading"><h2>Appena aggiunti</h2><button class="textbtn" data-action="albums">Tutti</button></div><div class="shelf">${tile('madreperla')}${tile('caos')}</div></section><section class="section discovery"><p class="source">${ic('globe')} Scoperta · Deezer</p><h2>Se ti piace Guè</h2><div class="people">${person('fibra')}${person('marra')}${person('salmo')}</div></section>`}
function artist(){const a=artists[state.artist];return `<div class="hero">${pic(state.artist)}<div class="hero-copy"><p class="eyebrow">Artista</p><h1>${a.name}</h1><p class="source">${ic('library')} ${a.meta} nella tua libreria</p></div></div><div class="local-meta"><span class="source">${ic('library')} La tua musica</span><span class="small">Jellyfin</span></div><div class="actions"><button class="round" data-action="shuffle" aria-label="Riproduzione casuale">${ic('shuffle')}</button><button class="play" data-action="play" aria-label="Riproduci i brani in libreria">${ic(state.playing?'pause':'play')}</button><button class="round" data-action="download" aria-label="Scarica sul dispositivo">${ic('download')}</button></div><section><div class="heading"><h2>Più ascoltati</h2><button class="textbtn" data-action="tracks">Tutti</button></div>${songs.map((s,i)=>({s,i})).filter(({s})=>s[1]===state.artist).slice(0,2).map(({s,i})=>rowSong(s,i)).join('')||'<p class="small">Nessun brano incluso nei dati dimostrativi di questo artista.</p>'}</section><section class="section"><div class="heading"><h2>Album in libreria</h2><button class="textbtn" data-action="albums">Tutti</button></div><div class="shelf">${a.albums.slice(0,2).map(tile).join('')||'<p class="small">Nessun album incluso nei dati dimostrativi.</p>'}</div><button class="escape" data-action="catalogue">${ic('globe')}<span>Esplora la discografia<small>Uscite che non sono nella tua libreria</small></span>${ic('chevron-right')}</button></section><section class="section"><div class="heading"><h2>Artisti simili</h2></div><div class="people">${Object.keys(artists).filter(k=>k!==state.artist).slice(0,3).map(k=>person(k)).join('')}</div></section>`}
function library(){return `<div class="intro"><p class="eyebrow">Jellyfin</p><h1>La tua libreria</h1></div>${[['list-music','Playlist','1 playlist','playlists'],['disc-3','Album','20 album','albums'],['users','Artisti','26 artisti principali','artists'],['music-2','Tracce','202 brani','tracks']].map(a=>`<button class="collection-row" data-action="${a[3]}">${ic(a[0])}<span><h3>${a[1]}</h3><p class="small">${a[2]}</p></span>${ic('chevron-right')}</button>`).join('')}<section class="section"><p class="eyebrow">Sfoglia</p>${[['tags','Generi','genres'],['download','Scaricati','downloads'],['cloud-download','Richieste','wants']].map(a=>`<button class="collection-row" data-action="${a[2]}">${ic(a[0])}<span>${a[1]}</span>${ic('chevron-right')}</button>`).join('')}</section><button class="escape" data-action="settings">${ic('settings')}<span>Impostazioni</span>${ic('chevron-right')}</button>`}
function artistCollection(){return `<div class="artist-intro"><h1>Artisti</h1><p class="small">${state.collabs?'53 crediti nella libreria':'26 artisti principali'}</p></div><label class="search">${ic('search')}<input type="search" placeholder="Cerca nella tua libreria" aria-label="Cerca artisti"></label><div class="filter"><span class="source">${ic('arrow-down-a-z')} Alfabetico</span><label><input type="checkbox" data-collabs ${state.collabs?'checked':''}>Collaborazioni</label></div><div class="artist-list">${['fibra','gue','marra','salmo'].map(k=>person(k,artists[k].meta)).join('')}${state.collabs?`<button class="person" data-action="artist" data-key="gue">${pic('gue')}<h3>Guè feat. Capo Plaza</h3><p class="small">Credito originale</p></button>`:''}</div>`}
function album(){const r=records[state.album],outside=state.album==='oro';return `${pic(state.album,'album-art',r.title)}<h1 class="album-name">${r.title}</h1><button class="artist-link" data-action="artist" data-key="${r.artist}">${pic(r.artist)}${artists[r.artist].name}${ic('chevron-right')}</button><p class="small">Album · ${r.year}</p>${outside?`<div class="external-info"><strong>Fuori dalla tua libreria</strong><p class="small">Catalogo Deezer · anteprime di 30 secondi</p></div><button class="request" data-action="request">${ic('cloud-download')} ${state.requested?'Richiesta inviata · demo':'Richiedi album'}</button><p class="small" style="text-align:center;margin-top:8px">Tramite SoulSync</p>`:`<div class="local-meta"><span class="source">${ic('library')} Nella tua libreria</span><span class="small">Jellyfin</span></div><div class="actions"><button class="round" data-action="shuffle" aria-label="Riproduzione casuale">${ic('shuffle')}</button><button class="play" data-action="play-album" aria-label="Riproduci album">${ic('play')}</button><button class="round" data-action="download" aria-label="Scarica sul dispositivo">${ic('download')}</button></div>`}<section class="section"><div class="heading"><h2>${outside?'Ascolta un’anteprima':'Brani'}</h2></div>${outside?['Il ragazzo d’oro','Non lo spegnere','Giù il soffitto'].map((title,i)=>track(title,'Anteprima · 30 s',state.album,i+1,true)).join(''):songs.map((s,i)=>s[2]===state.album?rowSong(s,i):'').join('')}<p class="demo-note">Selezione di brani dimostrativa</p></section>`}
function catalogue(){return `<div class="intro"><p class="eyebrow">${artists[state.artist].name}</p><h1>Da esplorare</h1><p class="small" style="margin-top:8px">Uscite fuori libreria · Deezer</p></div><div class="shelf">${tile('oro')}</div><div class="external-info"><strong>Prima scopri, poi richiedi</strong><p class="small">Apri un album per ascoltare le anteprime e richiederlo tramite SoulSync.</p></div>`}
function sheet(){
 if(!state.sheet)return '';
 const title={request:'Richiedi album',output:'Uscita audio',lyrics:'Testo del brano',options:'Opzioni'}[state.sheet];
 let content='';
 if(state.sheet==='request')content=`<div class="row">${pic(state.album)}<div><h3>${records[state.album].title}</h3><p class="small">${artists[records[state.album].artist].name}</p></div></div><div class="sheet-row">${ic('cloud-download')}<span>SoulSync<p class="small">Servizio di download</p></span>${ic('check')}</div><p class="small" style="margin-top:14px">Prototipo: nessun download verrà avviato.</p><button class="request" data-action="confirm">Conferma richiesta · demo</button>`;
 else if(state.sheet==='output')content=`<div class="sheet-row">${ic('smartphone')}<span>Questo dispositivo<p class="small">Uscita corrente · esempio</p></span>${ic('check')}</div><p class="small" style="margin-top:16px">Gli altri dispositivi vengono mostrati solo quando disponibili.</p>`;
 else if(state.sheet==='lyrics')content=`<div class="row">${pic(songs[state.current][2])}<div><h3>${songs[state.current][0]}</h3><p class="small">${artists[songs[state.current][1]].name}</p></div></div><div class="external-info"><strong>Testo non incluso nel prototipo</strong><p class="small">Qui apparirà il testo restituito dalla fonte abilitata nell’app.</p></div>`;
 else content=[['heart','Aggiungi ai preferiti','like'],['list-music','Apri la coda','queue'],['download','Download sul dispositivo','downloads'],['cloud-download','Apri richieste','wants'],['info','Impostazioni e servizi','settings']].map(a=>`<button class="sheet-row" data-action="${a[2]}">${ic(a[0])}<span>${a[1]}</span></button>`).join('');
 return `<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="sheet-head"><h2>${title}</h2>${btn('close','x','Chiudi')}</div>${content}</section></div>`;
}
function render(){
 app.style.setProperty('--r',state.radius+'px');app.dataset.appearance=state.appearance;
 const screens={home,artist,artists:artistCollection,library,album,catalogue,search,playlists,playlist,player,queue,downloads,wants,settings,appearance,sources,connections,tracks,favourites,genres,albums:()=>`<div class="intro"><h1>Album</h1><p class="small">Nella tua libreria</p></div><div class="shelf">${['tropico','madreperla','sinatra','caos','persona'].map(tile).join('')}</div>`};
 const song=songs[state.current];
 app.innerHTML=`<div ${state.sheet?'inert':''}>`+top()+`<main class="body">${(screens[state.screen]||home)()}</main><div class="notice" role="status" aria-live="polite"></div>${state.screen==='player'?'':`<div class="mini"><button class="mini-open" data-action="player" aria-label="Apri il player">${pic(song[2])}<span class="copy">${song[0]}<span class="small" style="display:block">${artists[song[1]].name}</span></span></button>${btn('play',state.playing?'pause':'play',state.playing?'Pausa':'Riproduci')}${btn('skip','skip-forward','Brano successivo')}</div>`}<nav class="nav" aria-label="Navigazione">${[['home','house','Home'],['search','search','Cerca'],['library','library','Libreria']].map(a=>`<button data-action="${a[0]}" class="${state.tab===a[0]?'selected':''}" ${state.tab===a[0]?'aria-current="page"':''}>${ic(a[1])}<span>${a[2]}</span></button>`).join('')}</nav></div>${sheet()}`;
 if(state.screen==='home'&&!state.discovery)app.querySelector('.discovery')?.setAttribute('hidden','');
 if(state.screen==='player'&&state.coverTint)app.style.background='linear-gradient(180deg,light-dark(#e2edf0,#192d38),var(--bg) 75%)';else app.style.background='';
 if(globalThis.lucide)globalThis.lucide.createIcons();
 if(state.sheet)app.querySelector('[data-action="close"]')?.focus();
}
function go(screen){history.push({screen:state.screen,artist:state.artist,album:state.album,tab:state.tab});state.screen=screen;if(['home','search','library'].includes(screen))state.tab=screen;state.sheet=null;}
app.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;let message='';const action=button.dataset.action;
 switch(action){
 case 'home':case 'library':case 'artists':case 'albums':case 'catalogue':case 'search':case 'playlists':case 'playlist':case 'player':case 'queue':case 'downloads':case 'wants':case 'settings':case 'appearance':case 'sources':case 'connections':case 'tracks':case 'favourites':case 'genres':go(action);break;
 case 'artist':go('artist');state.artist=button.dataset.key||'gue';break;
 case 'album':go('album');state.album=button.dataset.key||songs[state.current][2];break;
 case 'back':Object.assign(state,history.pop()||{screen:'home'});state.sheet=null;break;
 case 'play':state.playing=!state.playing;break;
 case 'play-album':state.current=Math.max(0,songs.findIndex(s=>s[2]===state.album));state.playing=true;state.position=0;break;
 case 'shuffle':state.shuffle=true;state.playing=true;break;
 case 'shuffle-mode':state.shuffle=!state.shuffle;break;
 case 'repeat':state.repeat=!state.repeat;break;
 case 'select-song':state.current=Number(button.dataset.key);state.position=0;state.playing=true;break;
 case 'skip':state.current=(state.current+1)%songs.length;state.position=0;break;
 case 'previous':state.current=(state.current+songs.length-1)%songs.length;state.position=0;break;
 case 'like':state.liked=!state.liked;state.sheet=null;message=state.liked?'Aggiunto ai preferiti · demo':'Rimosso dai preferiti · demo';break;
 case 'options':state.sheet='options';break;
 case 'request':state.album='oro';state.sheet='request';break;
 case 'confirm':state.requested=true;state.sheet=null;go('wants');message='Richiesta simulata. Nessun download avviato.';break;
 case 'close':state.sheet=null;break;
 case 'preview':message='Anteprima simulata · 30 secondi';break;
 case 'download':go('downloads');break;
 case 'pause-download':state.paused=!state.paused;break;
 case 'scope':state.searchScope=button.dataset.key;break;
 case 'appearance-mode':state.appearance=button.dataset.key;break;
 case 'output':state.sheet='output';break;
 case 'lyrics':state.sheet='lyrics';break;
 case 'sheetdemo':state.sheet=null;message='Azione simulata';break;
 }
 render();app.querySelector('.notice').textContent=message;remember();
});
app.addEventListener('input',e=>{
 if(e.target.matches('[data-global-search]')){state.searchText=e.target.value;app.querySelector('.results').innerHTML=searchResults();if(globalThis.lucide)globalThis.lucide.createIcons();}
 else if(e.target.matches('input[type=search]'))app.querySelectorAll('.artist-list .person').forEach(p=>p.hidden=!p.textContent.toLocaleLowerCase('it').includes(e.target.value.toLocaleLowerCase('it')));
 if(e.target.matches('[data-position]')){state.position=Number(e.target.value);app.querySelector('[data-elapsed]').textContent=elapsed();}
});
app.addEventListener('change',e=>{if(e.target.matches('[data-collabs]'))state.collabs=e.target.checked;if(e.target.matches('[data-tint]'))state.coverTint=e.target.checked;if(e.target.matches('[data-discovery]'))state.discovery=e.target.checked;render();remember();});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addSlider(state,'radius',{label:'Raggio superfici',min:0,max:20,unit:'px'});}
restoreViews.push(()=>{restore(savedViews[app.dataset.start]);render();});
});
globalThis.addEventListener?.('openai:set_globals',e=>{const views=e.detail?.globals?.widgetState?.privateContent?.views;if(views){savedViews=views;restoreViews.forEach(fn=>fn());}});
})();
</script>
</div>
